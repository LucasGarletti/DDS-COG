services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dds_cog
      MYSQL_USER: tickgo
      MYSQL_PASSWORD: tickgo123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dds_cog
      DB_USER: tickgo
      DB_PASSWORD: tickgo123
      JWT_SECRET: tickgo-local-docker-secret
      JWT_EXPIRES: 24
      RUN_SEED: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
